// ─── Unit conversion helpers ──────────────────────────────────────────────────
function cvtTemp(c, unit) {
  if (unit === "F") return Math.round(c * 9/5 + 32);
  return c;
}
function fmtTemp(c, unit) { return cvtTemp(c, unit) + "°" + unit; }

function cvtSpeed(mph, unit) {
  if (unit === "kmh") return Math.round(mph * 1.60934);
  return mph;
}
function fmtSpeed(mph, unit) {
  return cvtSpeed(mph, unit) + (unit === "kmh" ? " km/h" : " mph");
}

function cvtRain(mm, unit) {
  if (unit === "in") return (mm * 0.0393701).toFixed(2);
  return mm.toFixed(1);
}
function fmtRain(mm, unit) {
  if (mm === 0) return "0" + (unit === "in" ? '"' : "mm");
  return cvtRain(mm, unit) + (unit === "in" ? '"' : "mm");
}

function cvtPressure(mbar, unit) {
  if (unit === "pa")  return Math.round(mbar * 100);
  if (unit === "bar") return (mbar / 1000).toFixed(4);
  if (unit === "ba")  return Math.round(mbar * 1000);
  return mbar; // mbar default
}
function fmtPressure(mbar, unit) {
  const v = cvtPressure(mbar, unit);
  if (unit === "pa")  return v + " Pa";
  if (unit === "bar") return v + " bar";
  if (unit === "ba")  return v + " ba";
  return v + " mbar";
}

// ─── Wind helpers ─────────────────────────────────────────────────────────────
function windCategory(mph) {
  if (mph < 5)  return "Very Light Wind";
  if (mph < 10) return "Light Breeze";
  if (mph < 15) return "Moderate Breeze";
  if (mph < 20) return "Fresh Breeze";
  if (mph < 30) return "Strong Breeze";
  if (mph < 40) return "Gale";
  if (mph < 50) return "Strong Gale";
  if (mph < 60) return "Violent Gale";
  if (mph < 73) return "Very Violent Gale";
  return "Hurricane Winds";
}

// ─── Feel-like system ─────────────────────────────────────────────────────────
function getConditionBonus(condition, temp, forShade) {
  const isRaining = condition.includes("🌧") || condition.includes("⛈") || condition.includes("🌦");
  const eff = forShade ? (isRaining ? condition : "☁️") : condition;
  if (eff.includes("⛈")) return -5;
  if (eff.includes("🌧")) return -4;
  if (eff.includes("🌦")) return -4;
  if (eff.includes("☁"))  return -2;
  if (eff.includes("⛅")) return  0;
  if (eff.includes("🌤")) return  1;
  if (eff.includes("🌡")) { return temp>40?8:temp>35?7:temp>30?6:temp>25?5:4; }
  if (eff.includes("☀"))  { return temp>40?8:temp>35?7:temp>30?6:temp>25?5:temp>20?4:3; }
  return 0;
}
function getHumidityBonus(h) {
  if (h<=10) return -2; if (h<=20) return -1; if (h<=30) return 0;
  if (h<=40) return 1;  if (h<=50) return 2;  if (h<=60) return 3;
  if (h<=70) return 4;  if (h<=80) return 6;  if (h<=90) return 8;
  return 10;
}
function getWindBonus(mph) {
  if (mph<5)  return  1; if (mph<10) return  0; if (mph<15) return -1;
  if (mph<20) return -3; if (mph<30) return -5; if (mph<40) return -6;
  if (mph<50) return -8; if (mph<60) return -13; return -30;
}
function getSunFeelLike(temp, mph, hum, cond) {
  return Math.round(temp + getConditionBonus(cond,temp,false) + getHumidityBonus(hum) + getWindBonus(mph));
}
function getShadeFeelLike(temp, mph, hum, cond) {
  return Math.round(temp + getConditionBonus(cond,temp,true) + getHumidityBonus(hum) + getWindBonus(mph));
}
function hasSun(c) { return c.includes("☀")||c.includes("🌡")||c.includes("🌤")||c.includes("⛅"); }

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.72)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:60}}>
      <div style={{background:"#0e1624",border:"1px solid rgba(255,119,0,0.35)",borderRadius:16,padding:"22px 24px",width:"min(420px,92vw)",boxShadow:"0 8px 40px rgba(0,0,0,0.8)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <span style={{fontSize:15,color:"#ff9944",letterSpacing:2,textTransform:"uppercase"}}>⚙ Settings</span>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#888",fontSize:20,cursor:"pointer",lineHeight:1}}>✕</button>
        </div>

        <div style={row}>
          <span style={label}>🌡 Temperature</span>
          <div style={btnGroup}>
            <Btn val="C" cur={units.temp} onClick={v=>setUnits(u=>({...u,temp:v}))}>°C</Btn>
            <Btn val="F" cur={units.temp} onClick={v=>setUnits(u=>({...u,temp:v}))}>°F</Btn>
          </div>
        </div>

        <div style={row}>
          <span style={label}>💨 Wind Speed</span>
          <div style={btnGroup}>
            <Btn val="mph" cur={units.speed} onClick={v=>setUnits(u=>({...u,speed:v}))}>mph</Btn>
            <Btn val="kmh" cur={units.speed} onClick={v=>setUnits(u=>({...u,speed:v}))}>km/h</Btn>
          </div>
        </div>

        <div style={row}>
          <span style={label}>🌧 Precipitation</span>
          <div style={btnGroup}>
            <Btn val="mm" cur={units.rain} onClick={v=>setUnits(u=>({...u,rain:v}))}>mm</Btn>
            <Btn val="in" cur={units.rain} onClick={v=>setUnits(u=>({...u,rain:v}))}>in</Btn>
          </div>
        </div>

        <div style={{...row, borderBottom:"none"}}>
          <span style={label}>📊 Pressure</span>
          <div style={btnGroup}>
            <Btn val="mbar" cur={units.pressure} onClick={v=>setUnits(u=>({...u,pressure:v}))}>mbar</Btn>
            <Btn val="pa"   cur={units.pressure} onClick={v=>setUnits(u=>({...u,pressure:v}))}>Pa</Btn>
            <Btn val="bar"  cur={units.pressure} onClick={v=>setUnits(u=>({...u,pressure:v}))}>bar</Btn>
            <Btn val="ba"   cur={units.pressure} onClick={v=>setUnits(u=>({...u,pressure:v}))}>ba</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [sel,      setSel]      = useState(null);
  const [graph,    setGraph]    = useState("temp");
  const [showSett, setShowSett] = useState(false);
  const [units,    setUnits]    = useState({ temp:"C", speed:"mph", rain:"mm", pressure:"mbar" });

  const u = units;
  const maxT = Math.max(...forecastData.map(d=>d.temp));
  const minT = Math.min(...forecastData.map(d=>d.temp));
  const n    = forecastData.length;
  const CHART_H = 143;

  const tabs = [
    {id:"temp",     label:"🌡 Temp"},
    {id:"rain",     label:"🌧 Rain %"},
    {id:"rainmm",   label:"💦 Rainfall"},
    {id:"humidity", label:"💧 Humidity"},
    {id:"wind",     label:"💨 Wind"},
    {id:"pressure", label:"📊 Pressure"},
  ];

  const maxP = Math.max(...forecastData.map(d=>d.pressure));
  const minP = Math.min(...forecastData.map(d=>d.pressure));
  const maxRmm = Math.max(...forecastData.map(d=>d.rainMm));

  const gd = graph==="rain"     ? {values:forecastData.map(d=>d.rain),     colors:forecastData.map(d=>rc(d.rain)),     max:100}
           : graph==="rainmm"   ? {values:forecastData.map(d=>d.rainMm),   colors:forecastData.map(d=>rc(d.rain)),     max:Math.max(maxRmm,1)}
           : graph==="humidity" ? {values:forecastData.map(d=>d.humidity), colors:forecastData.map(d=>hc(d.humidity)), max:100}
           : graph==="wind"     ? {values:forecastData.map(d=>d.windMph),  colors:forecastData.map(d=>wc(d.windMph)),  max:40}
           : graph==="pressure" ? {values:forecastData.map(d=>d.pressure), colors:forecastData.map(d=>pc(d.pressure)), max:maxP}
           :                      {values:forecastData.map(d=>d.temp),     colors:forecastData.map(d=>tc(d.temp)),     max:maxT};

  const s = {
    page:{fontFamily:"Georgia,'Times New Roman',serif",background:"linear-gradient(160deg,#0a0a1a 0%,#0d1525 40%,#0a0f1e 100%)",minHeight:"100vh",color:"#e8dcc8",overflowX:"hidden"},
    wrap:{position:"relative",zIndex:1,maxWidth:960,margin:"0 auto",padding:"32px 16px 60px"},
    panel:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.10)",borderRadius:16,padding:"20px 16px 14px",marginBottom:26},
    grid:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:9},
  };

  // Graph bar unit label for popup
  function graphValLabel(d) {
    if (graph==="temp")     return fmtTemp(d.temp, u.temp);
    if (graph==="rain")     return d.rain + "%";
    if (graph==="rainmm")   return fmtRain(d.rainMm, u.rain);
    if (graph==="humidity") return d.humidity + "%";
    if (graph==="wind")     return fmtSpeed(d.windMph, u.speed);
    if (graph==="pressure") return fmtPressure(d.pressure, u.pressure);
    return "";
  }

  return (
    <div style={s.page}>
      {showSett && <SettingsPanel units={units} setUnits={setUnits} onClose={()=>setShowSett(false)} />}

      <div style={s.wrap}>
        {/* Header */}
        <div style={{textAlign:"center",marginBottom:32,position:"relative"}}>
          {/* Settings button */}
          <button onClick={()=>setShowSett(true)} style={{
            position:"absolute",right:0,top:0,
            background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.15)",
            borderRadius:10,padding:"6px 12px",color:"#aaa",fontSize:13,cursor:"pointer",
            display:"flex",alignItems:"center",gap:6
          }}>⚙ Settings</button>

          <div style={{fontSize:11,letterSpacing:6,color:"#ff7700",textTransform:"uppercase",marginBottom:8}}>2 Month Forecast · London, England</div>
          <h1 style={{fontSize:"clamp(24px,5vw,42px)",fontWeight:"normal",margin:"0 0 5px",color:"#fff",lineHeight:1.1}}>25 May – 25 July 2026</h1>
          <div style={{fontSize:13,color:"#9a8c7a",marginBottom:14}}>Estimated daily maxima · Adjusted for heatwave underestimation</div>
          <div style={{display:"flex",gap:18,justifyContent:"center",flexWrap:"wrap",fontSize:12,color:"#9a8c7a"}}>
            {[{col:"#ff7700",label:"Met Office Confirmed",solid:true},{col:"#4a9fd4",label:"Near-term Forecast",solid:false},{col:"#555",label:"Estimated",solid:false}].map((l,i)=>(
              <span key={i} style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:10,height:10,borderRadius:l.solid?2:"50%",background:l.col,display:"inline-block"}}/>
                {l.label}
              </span>
            ))}
          </div>
        </div>

        {/* Graph panel */}
        <div style={s.panel}>
          {/* Tabs */}
          <div style={{display:"flex",gap:5,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setGraph(t.id)} style={{
                padding:"5px 11px",borderRadius:20,border:"1px solid",
                borderColor:graph===t.id?"#ff7700":"rgba(255,255,255,0.12)",
                background:graph===t.id?"rgba(255,119,0,0.18)":"rgba(255,255,255,0.03)",
                color:graph===t.id?"#ffaa44":"#888",
                fontSize:11,cursor:"pointer"
              }}>{t.label}</button>
            ))}
            {sel!==null&&(
              <div style={{marginLeft:"auto",fontSize:12,color:"#aaa"}}>
                <span style={{color:"#fff",fontWeight:"bold"}}>{forecastData[sel].date}</span>
                <span style={{color:tc(forecastData[sel].temp),marginLeft:8}}>↑{fmtTemp(forecastData[sel].temp,u.temp)}</span>
                <span style={{color:"#7bbf44",marginLeft:6}}>↓{fmtTemp(forecastData[sel].low,u.temp)}</span>
              </div>
            )}
          </div>

          {/* Bars */}
          <div style={{position:"relative",height:155}}>
            {/* Month record lines — temp graph only */}
            {graph==="temp" && MONTH_RECORDS.map((rec,ri)=>{
              const bottomPx  = ((rec.temp-minT)/(maxT-minT))*CHART_H+6;
              const bottomPct = (bottomPx/155)*100;
              const leftPct   = (rec.startIdx/n)*100;
              const rightPct  = ((n-1-rec.endIdx)/n)*100;
              const recLabel  = rec.label + (u.temp==="F" ? " ("+cvtTemp(rec.temp,"F")+"°F)" : "°C");
              return (
                <div key={ri} style={{position:"absolute",bottom:bottomPct+"%",left:leftPct+"%",right:rightPct+"%",borderTop:"1px dashed "+rec.color,zIndex:2,pointerEvents:"none"}}>
                  <span style={{fontSize:9,color:rec.color,position:"absolute",right:0,top:-13,background:"rgba(10,10,26,0.85)",padding:"1px 5px",borderRadius:3,whiteSpace:"nowrap"}}>{recLabel}</span>
                </div>
              );
            })}

            {/* Pressure reference lines */}
            {graph==="pressure" && [1010,1020,1030].map(ref=>{
              const pct = ((ref-minP)/(maxP-minP))*90+6;
              const pctB = Math.min(Math.max(pct,2),98);
              return (
                <div key={ref} style={{position:"absolute",bottom:pctB+"%",left:0,right:0,borderTop:"1px dashed rgba(255,255,255,0.15)",zIndex:2,pointerEvents:"none"}}>
                  <span style={{fontSize:9,color:"#666",position:"absolute",left:0,top:-11,background:"rgba(10,10,26,0.85)",padding:"1px 4px",borderRadius:2}}>{fmtPressure(ref,u.pressure)}</span>
                </div>
              );
            })}

            <div style={{display:"flex",alignItems:"flex-end",gap:2,height:"100%"}}>
              {forecastData.map((d,i)=>{
                const val=gd.values[i], col=gd.colors[i];
                const h=Math.max(4,(val/gd.max)*90+6);
                const isSel=sel===i, isC=d.type==="confirmed", isN=d.type==="near";
                return(
                  <div key={i} onClick={()=>setSel(sel===i?null:i)}
                    title={d.date+": "+graphValLabel(d)}
                    style={{flex:1,height:h+"%",
                      background:isC?("linear-gradient(to top,"+col+",rgba(255,255,255,0.5))"):isN?("linear-gradient(to top,"+col+"ee,"+col+"88)"):("linear-gradient(to top,"+col+"cc,"+col+"55)"),
                      borderRadius:"3px 3px 0 0",cursor:"pointer",
                      outline:isSel?"2px solid "+col:"none",
                      boxShadow:isC?"0 0 8px "+col+"77":isSel?"0 0 6px "+col+"55":"none",
                      opacity:isSel?1:0.88,transition:"all 0.15s",minWidth:0}}
                  />
                );
              })}
            </div>

            {/* Graph popup */}
            {sel!==null&&(()=>{
              const d=forecastData[sel];
              const bx=(sel/(n-1))*100;
              const fl=bx>62;
              return(
                <div style={{position:"absolute",bottom:"calc(100% - 143px)",
                  left:fl?"auto":"calc("+bx+"% + 4px)",right:fl?"calc("+(100-bx)+"% + 4px)":"auto",
                  background:"rgba(12,16,30,0.97)",border:"1px solid "+tc(d.temp)+"55",
                  borderRadius:10,padding:"11px 13px",minWidth:185,zIndex:10,
                  boxShadow:"0 4px 24px rgba(0,0,0,0.65)",pointerEvents:"none"}}>
                  <div style={{fontSize:13,fontWeight:"bold",color:"#fff",marginBottom:7}}>{d.date} {d.condition}</div>
                  <div style={{display:"flex",gap:16,marginBottom:8}}>
                    <div><div style={{fontSize:9,color:"#666",textTransform:"uppercase",letterSpacing:1}}>High</div><div style={{fontSize:20,fontWeight:"bold",color:tc(d.temp)}}>{fmtTemp(d.temp,u.temp)}</div></div>
                    <div><div style={{fontSize:9,color:"#666",textTransform:"uppercase",letterSpacing:1}}>Low</div><div style={{fontSize:20,fontWeight:"bold",color:"#7bbf44"}}>{fmtTemp(d.low,u.temp)}</div></div>
                  </div>
                  <div style={{fontSize:11,color:"#aaa",display:"flex",flexDirection:"column",gap:4,lineHeight:1.4}}>
                    <span>📊 Pressure: <b style={{color:pc(d.pressure)}}>{fmtPressure(d.pressure,u.pressure)}</b></span>
                    <span>🌧 Rain chance: <b style={{color:rc(d.rain)}}>{d.rain}%</b></span>
                    <span>💦 Rainfall: <b style={{color:rc(d.rain)}}>{fmtRain(d.rainMm,u.rain)}</b>{d.rainHours>0&&<span style={{color:"#666",fontSize:10}}> over {d.rainHours}h</span>}</span>
                    <span>💧 Humidity: <b style={{color:hc(d.humidity)}}>{d.humidity}%</b></span>
                    <span>💨 Wind: <b style={{color:wc(d.windMph)}}>{fmtSpeed(d.windMph,u.speed)}</b><span style={{color:"#777",fontSize:10}}> · {windCategory(d.windMph)}</span></span>
                    <span style={{color:"#888",fontSize:10}}>Gusts up to <b style={{color:wc(d.gustMph)}}>{fmtSpeed(d.gustMph,u.speed)}</b></span>
                    <span style={{marginTop:2,color:"#9a8c7a"}}>{d.note}</span>
                  </div>
                </div>
              );
            })()}
          </div>

          <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontSize:11,color:"#777"}}>
            <span>25 May</span><span>1 Jun</span><span>15 Jun</span><span>1 Jul</span><span>25 Jul</span>
          </div>
          {graph==="temp"&&(
            <div style={{display:"flex",justifyContent:"flex-end",gap:12,marginTop:5,fontSize:10}}>
              {[15,20,25,30,35,38].map(t=><span key={t} style={{color:tc(t)}}>{fmtTemp(t,u.temp)}</span>)}
            </div>
          )}
          {graph==="pressure"&&(
            <div style={{display:"flex",gap:8,marginTop:6,fontSize:9,color:"#777",flexWrap:"wrap"}}>
              {[[1035,"High (Heat)","#ff6600"],[1020,"Normal","#88ddff"],[1005,"Low (Rain)","#9955cc"]].map(([p,l,c])=>(
                <span key={p}><span style={{color:c}}>{fmtPressure(p,u.pressure)}</span> = {l}</span>
              ))}
            </div>
          )}
          {graph==="wind"&&(
            <div style={{display:"flex",gap:8,marginTop:6,fontSize:9,color:"#777",flexWrap:"wrap"}}>
              {[["<5","Very Light"],["5-10","Light"],["10-20","Mod/Fresh"],["20-30","Strong"],["30+","Gale+"]].map(([r,l])=>(
                <span key={r}><span style={{color:"#ffcc88"}}>{r} mph</span> = {l}</span>
              ))}
            </div>
          )}
        </div>

        {/* Day cards */}
        <div style={s.grid}>
          {forecastData.map((d,i)=>{
            const color=tc(d.temp), isC=d.type==="confirmed", isN=d.type==="near", isSel=sel===i;
            const shade=getShadeFeelLike(d.temp,d.windMph,d.humidity,d.condition);
            const sun=getSunFeelLike(d.temp,d.windMph,d.humidity,d.condition);
            const sunny=hasSun(d.condition);
            const storm=d.humidity>=50&&d.temp>=28;
            const cat=windCategory(d.windMph);
            return(
              <div key={i} onClick={()=>setSel(sel===i?null:i)} style={{
                background:isSel?bg(d.temp):"rgba(255,255,255,0.03)",
                border:"1px solid "+(isC?color+"66":isN?color+"44":"rgba(255,255,255,0.08)"),
                borderRadius:12,padding:"13px 11px 11px",cursor:"pointer",
                transition:"all 0.2s",transform:isSel?"scale(1.03)":"scale(1)",
                boxShadow:isSel?"0 6px 24px "+color+"28":"none",
              }}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:7}}>
                  <div>
                    <div style={{fontSize:11,color:"#bbb",letterSpacing:1,textTransform:"uppercase",fontWeight:"bold"}}>{d.date.split(" ").slice(0,2).join(" ")}</div>
                    <div style={{fontSize:10,color:"#666",marginTop:1}}>{d.date.split(" ").slice(2).join(" ")}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <span style={{fontSize:20}}>{d.condition}</span>
                    {storm&&<div style={{fontSize:9,color:"#ffcc00",marginTop:1}}>⚡ storm risk</div>}
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"baseline",gap:3,marginBottom:8}}>
                  <span style={{fontSize:30,fontWeight:"bold",color,lineHeight:1}}>{fmtTemp(d.temp,u.temp)}</span>
                  <span style={{fontSize:11,color:"#5a7a5a",marginLeft:6}}>↓{fmtTemp(d.low,u.temp)}</span>
                </div>
                <div style={{background:"rgba(0,0,0,0.28)",borderRadius:8,padding:"7px 9px",marginBottom:8,display:"flex",flexDirection:"column",gap:4}}>
                  {sunny&&(
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:11,color:"#ffd060"}}>☀️ Feels in sun</span>
                      <span style={{fontSize:14,fontWeight:"bold",color:tc(sun)}}>{fmtTemp(sun,u.temp)}</span>
                    </div>
                  )}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#a0b4c8"}}>🌑 Feels in shade</span>
                    <span style={{fontSize:14,fontWeight:"bold",color:tc(shade)}}>{fmtTemp(shade,u.temp)}</span>
                  </div>
                </div>
                <div style={{display:"flex",gap:4,fontSize:10,flexWrap:"wrap",marginBottom:4}}>
                  <span style={{color:rc(d.rain)}}>🌧{d.rain}%</span>
                  <span style={{color:rc(d.rain)}}>💦{fmtRain(d.rainMm,u.rain)}</span>
                  {d.rainHours>0&&<span style={{color:"#6688aa"}}>{d.rainHours}h</span>}
                </div>
                <div style={{display:"flex",gap:4,fontSize:10,flexWrap:"wrap",marginBottom:isSel?6:0}}>
                  <span style={{color:hc(d.humidity)}}>💧{d.humidity}%</span>
                  <span style={{color:wc(d.windMph)}}>💨{fmtSpeed(d.windMph,u.speed)}</span>
                  <span style={{color:pc(d.pressure)}}>📊{fmtPressure(d.pressure,u.pressure)}</span>
                </div>
                {isSel&&(
                  <div style={{fontSize:11,color:"#9a8c7a",marginTop:6,borderTop:"1px solid rgba(255,255,255,0.07)",paddingTop:8,lineHeight:1.6}}>
                    <div style={{marginBottom:6}}>{d.note}</div>
                    <div style={{display:"flex",flexDirection:"column",gap:3}}>
                      <span>📊 Pressure: <b style={{color:pc(d.pressure)}}>{fmtPressure(d.pressure,u.pressure)}</b></span>
                      <span>🌧 Rain chance: <b style={{color:rc(d.rain)}}>{d.rain}%</b></span>
                      <span>💦 Rainfall: <b style={{color:rc(d.rain)}}>{fmtRain(d.rainMm,u.rain)}</b>{d.rainHours>0&&<span style={{color:"#666",fontSize:10}}> over approx. {d.rainHours} hours</span>}</span>
                      <span>💧 Humidity: <b style={{color:hc(d.humidity)}}>{d.humidity}%</b></span>
                      <span>💨 Wind: <b style={{color:wc(d.windMph)}}>{fmtSpeed(d.windMph,u.speed)}</b><span style={{color:"#666",fontSize:10}}> — {cat}</span></span>
                      <span style={{color:"#777",fontSize:10}}>Gusts: <b style={{color:wc(d.gustMph)}}>{fmtSpeed(d.gustMph,u.speed)}</b><span style={{color:"#555"}}> ({windCategory(d.gustMph)})</span></span>
                    </div>
                    {isC&&<div style={{color:"#ff7700",marginTop:5,fontSize:10}}>✓ Met Office confirmed</div>}
                    {isN&&<div style={{color:"#4a9fd4",marginTop:5,fontSize:10}}>~ Near-term forecast</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Rationale */}
        <div style={{marginTop:30,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"20px"}}>
          <div style={{fontSize:11,letterSpacing:4,color:"#ff7700",textTransform:"uppercase",marginBottom:16}}>Forecast Rationale</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:16}}>
            {[
              {icon:"🌊",title:"Jet Stream",text:"Current pattern has the jet stream displaced north, favouring blocking high pressure — a key driver of extended UK heat events."},
              {icon:"🌱",title:"Dry Soil Effect",text:"England endured its driest spring in 132 years in 2025. Dry ground heats faster, amplifying peak temperatures by 2–4°C."},
              {icon:"☀️",title:"Warm Spring 2026",text:"May 2026 reached 34–35°C — one of the hottest bank holiday weekends on record, setting a warm baseline for summer."},
              {icon:"📈",title:"Heatwave Bias",text:"Forecast models systematically underestimate heatwave peaks. Temperatures are adjusted upward for the June and July heat events."},
              {icon:"🏆",title:"Record Risk",text:"May record is 32.8°C, June's is 35.6°C, July's is 40.2°C. The forecast peaks of 36°C (Jun 20) and 38°C (Jul 5) represent plausible record-threatening events."},
              {icon:"⚡",title:"Storm Risk",text:"On very hot days when humidity rises unexpectedly, violent thunderstorms are possible. Cards flag days where temp and humidity combine dangerously."},
            ].map((r,i)=>(
              <div key={i} style={{display:"flex",gap:12}}>
                <span style={{fontSize:22,flexShrink:0}}>{r.icon}</span>
                <div>
                  <div style={{fontSize:13,color:"#e8dcc8",fontWeight:"bold",marginBottom:4}}>{r.title}</div>
                  <div style={{fontSize:12,color:"#7a6e5e",lineHeight:1.55}}>{r.text}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={{textAlign:"center",marginTop:20,fontSize:11,color:"#4a4a5a",lineHeight:1.7}}>
          Estimated long-range forecast for illustrative purposes only.<br/>
          Tap any bar or card for details · First 5 days from Met Office data
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
