function getDayPeriods(d) {
  const baseTemp = d.temp;
  const baseLow = d.low;
  const isRainy = d.rain > 40;
  return {
    morning: { time: "06:00-12:00", temp: Math.round(baseLow + (baseTemp - baseLow)*0.4), condition: d.condition, rain: isRainy ? Math.round(d.rain*0.6) : Math.max(0,d.rain-10), rainMm: Math.round(d.rainMm*0.4), windMph: Math.round(d.windMph*0.9), note: isRainy ? "Showers building" : "Dry start" },
    afternoon: { time: "12:00-18:00", temp: baseTemp, condition: d.condition, rain: d.rain, rainMm: d.rainMm, windMph: d.windMph, note: d.note },
    evening: { time: "18:00-00:00", temp: Math.round(baseTemp*0.75 + baseLow*0.25), condition: d.condition, rain: isRainy ? Math.round(d.rain*0.7) : Math.max(0,d.rain-15), rainMm: Math.round(d.rainMm*0.5), windMph: Math.round(d.windMph*1.1), note: "Cooling down" }
  };
}

// Original helper functions
const tc = t => t>=36?"#ff1500":t>=33?"#ff3d00":t>=30?"#ff6600":t>=27?"#ff8800":t>=24?"#ffaa00":t>=21?"#ffcc00":t>=18?"#c8d400":t>=15?"#7bbf44":"#4a9fd4";
const rc = r => r>=70?"#4488ff":r>=40?"#66aaff":r>=20?"#88ccff":"#aaddff";
const hc = h => h>=80?"#7755cc":h>=60?"#9977dd":h>=40?"#bbaaee":"#ddccff";
const wc = w => w>=30?"#ff7722":w>=20?"#ffaa44":w>=10?"#ffcc88":"#fff0cc";
const pc = p => p>=1030?"#ff6600":p>=1020?"#ffaa00":p>=1010?"#88ddff":p>=1000?"#6699cc":"#9955cc";
const bg = t => t>=33?"rgba(255,45,0,0.18)":t>=30?"rgba(255,100,0,0.14)":t>=27?"rgba(255,140,0,0.11)":t>=24?"rgba(255,170,0,0.09)":t>=21?"rgba(255,200,0,0.08)":t>=18?"rgba(180,210,0,0.08)":"rgba(74,159,212,0.06)";

function fmtTemp(c) { return c + "°C"; }
function fmtRain(mm) { return mm + "mm"; }
function fmtSpeed(mph) { return mph + " mph"; }
function fmtPressure(mb) { return mb + " mbar"; }

function windCategory(mph) {
  if(mph<5) return "Very Light Wind";
  if(mph<10) return "Light Breeze";
  if(mph<15) return "Moderate Breeze";
  if(mph<20) return "Fresh Breeze";
  return "Strong Wind";
}

function getShadeFeelLike(temp) { return Math.round(temp - 2); }
function getSunFeelLike(temp) { return Math.round(temp + 4); }
function hasSun(c) { return c.includes("☀") || c.includes("🌡") || c.includes("🌤"); }

  useEffect(() => {
    if (activeView !== "map" || !mapRef.current) return;

    if (!mapRef.current._map) {

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapRef.current._map);
    }

    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];

    forecastData.forEach((d, i) => {
      const offset = i * 0.03;
      const marker = L.marker([51.5074 + offset*0.6, -0.1278 + offset*0.4], {
        icon: L.divIcon({
          className: 'temp-marker',
          html: `<div style="color:${tc(d.temp)}">${d.temp}°</div>`,
          iconSize: [48, 40]
        })
      }).addTo(mapRef.current._map)
        .bindPopup(`<b>${d.date}</b><br>${d.temp}°C - ${d.condition}`);
      markersRef.current.push(marker);
    });
  }, [activeView]);

    <div style={{fontFamily:"Georgia,'Times New Roman',serif",background:"linear-gradient(160deg,#0a0a1a 0%,#0d1525 40%,#0a0f1e 100%)",minHeight:"100vh",color:"#e8dcc8"}}>

                              const p = periods[k];
                              return (
                                <div key={k} style={{background:"rgba(0,0,0,0.35)",padding:10,borderRadius:8,borderLeft:"4px solid " + tc(p.temp)}}>
                                  <div style={{fontSize:12,color:"#aaa"}}>{p.time}</div>
                                  <div style={{display:"flex",justifyContent:"space-between"}}>
                                    <span style={{color:tc(p.temp),fontWeight:"bold"}}>{p.temp}°</span>
                                    <span style={{color:rc(p.rain)}}>{p.rain}%</span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })()}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
