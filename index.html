// ─── Unit helpers ─────────────────────────────────────────────────────────────
function cvtTemp(c,u)    { return u==="F"?Math.round(c*9/5+32):c; }
function fmtTemp(c,u)    { return cvtTemp(c,u)+"°"+u; }
function cvtSpeed(m,u)   { return u==="kmh"?Math.round(m*1.60934):m; }
function fmtSpeed(m,u)   { return cvtSpeed(m,u)+(u==="kmh"?" km/h":" mph"); }
function cvtRain(mm,u)   { return u==="in"?(mm*0.0393701).toFixed(2):mm.toFixed(1); }
function fmtRain(mm,u)   { if(mm===0) return "0"+(u==="in"?'"':"mm"); return cvtRain(mm,u)+(u==="in"?'"':"mm"); }
function cvtPres(mb,u)   { if(u==="pa") return Math.round(mb*100); if(u==="bar") return (mb/1000).toFixed(4); if(u==="ba") return Math.round(mb*1000); return mb; }
function fmtPres(mb,u)   { const v=cvtPres(mb,u); if(u==="pa") return v+" Pa"; if(u==="bar") return v+" bar"; if(u==="ba") return v+" ba"; return v+" mbar"; }

// ─── Wind ─────────────────────────────────────────────────────────────────────
function windCat(mph) {
  if(mph<5)  return "Very Light Wind";  if(mph<10) return "Light Breeze";
  if(mph<15) return "Moderate Breeze"; if(mph<20) return "Fresh Breeze";
  if(mph<30) return "Strong Breeze";   if(mph<40) return "Gale";
  if(mph<50) return "Strong Gale";     if(mph<60) return "Violent Gale";
  if(mph<73) return "Very Violent Gale"; return "Hurricane Winds";
}

// ─── Feel-like ────────────────────────────────────────────────────────────────
function condBonus(cond,temp,shade) {
  const isRain=cond.includes("🌧")||cond.includes("⛈")||cond.includes("🌦");
  const eff=shade?(isRain?cond:"☁️"):cond;
  if(eff.includes("⛈")) return -5; if(eff.includes("🌧")) return -4;
  if(eff.includes("🌦")) return -4; if(eff.includes("☁"))  return -2;
  if(eff.includes("⛅")) return  0; if(eff.includes("🌤")) return  1;
  if(eff.includes("🌡")) return temp>40?8:temp>35?7:temp>30?6:temp>25?5:4;
  if(eff.includes("☀"))  return temp>40?8:temp>35?7:temp>30?6:temp>25?5:temp>20?4:3;
  return 0;
}
function humBonus(h)  { if(h<=10)return -2;if(h<=20)return -1;if(h<=30)return 0;if(h<=40)return 1;if(h<=50)return 2;if(h<=60)return 3;if(h<=70)return 4;if(h<=80)return 6;if(h<=90)return 8;return 10; }
function windBonus(m) { if(m<5)return 1;if(m<10)return 0;if(m<15)return -1;if(m<20)return -3;if(m<30)return -5;if(m<40)return -6;if(m<50)return -8;if(m<60)return -13;return -30; }
function sunFeel(t,m,h,c)   { return Math.round(t+condBonus(c,t,false)+humBonus(h)+windBonus(m)); }
function shadeFeel(t,m,h,c) { return Math.round(t+condBonus(c,t,true) +humBonus(h)+windBonus(m)); }
function hasSun(c) { return c.includes("☀")||c.includes("🌡")||c.includes("🌤")||c.includes("⛅"); }

// ─── Colours ──────────────────────────────────────────────────────────────────
const tc = t=>t>=36?"#ff1500":t>=33?"#ff3d00":t>=30?"#ff6600":t>=27?"#ff8800":t>=24?"#ffaa00":t>=21?"#ffcc00":t>=18?"#c8d400":t>=15?"#7bbf44":"#4a9fd4";
const rc = r=>r>=70?"#4488ff":r>=40?"#66aaff":r>=20?"#88ccff":"#aaddff";
const hc = h=>h>=80?"#7755cc":h>=60?"#9977dd":h>=40?"#bbaaee":"#ddccff";
const wc = w=>w>=30?"#ff7722":w>=20?"#ffaa44":w>=10?"#ffcc88":"#fff0cc";
const pc = p=>p>=1030?"#ff6600":p>=1020?"#ffaa00":p>=1010?"#88ddff":p>=1000?"#6699cc":"#9955cc";

// ─── Condition from WMO code ──────────────────────────────────────────────────
function condFromCode(code,temp) {
  if(code===0) return temp>=30?"🌡️":"☀️";
  if(code<=2)  return "⛅"; if(code<=3)  return "☁️"; if(code<=48) return "☁️";
  if(code<=57) return "🌦"; if(code<=67) return "🌧"; if(code<=77) return "🌨️";
  if(code<=82) return "🌦"; if(code<=86) return "🌨️"; return "⛈️";
}

// ─── Period breakdown ─────────────────────────────────────────────────────────
function getDayPeriods(d) {
  const isRainy=d.rain>40;
  return {

    afternoon:{ time:"12:00–18:00", temp:d.temp,                                condition:d.condition, rain:d.rain,                                                rainMm:d.rainMm,                               windMph:d.windMph,                    note:d.note },

// ─── Hourly data generator (from daily data) ─────────────────────────────────
function buildHourlyData(dailyData) {
  // Takes up to 3 days of daily data and creates plausible hourly breakdowns
  const hours = [];
  const days = dailyData.slice(0, 3);
  days.forEach(function(d) {
    for (var h = 0; h < 24; h++) {
      // Temperature curve: low at 05:00, peak at 15:00
      var progress = Math.sin(((h - 5) / 24) * Math.PI * 2 + Math.PI * 0.5);
      progress = Math.max(0, Math.min(1, (progress + 1) / 2));
      var tempCurve = d.low + (d.temp - d.low) * Math.pow(progress, 1.4);
      var temp = Math.round(tempCurve * 10) / 10;

      // Wind: slightly higher in afternoon
      var windFactor = h >= 11 && h <= 18 ? 1.15 : h < 6 || h > 21 ? 0.75 : 1.0;
      var windMph = Math.round(d.windMph * windFactor);
      var gustMph = Math.round(d.gustMph * windFactor);

      // Humidity: higher at night, lower midday
      var humCurve = d.humidity + (h < 6 || h > 22 ? 12 : h >= 12 && h <= 16 ? -10 : 0);
      var humidity = Math.min(99, Math.max(10, Math.round(humCurve)));

      // Rain: distribute across rainy hours
      var rainHourly = 0;
      var rainChance = d.rain;
      if (d.rainHours > 0) {
        // Concentrate rain in morning or afternoon depending on condition
        var rainPeak = d.condition.includes("⛈") ? (h >= 14 && h <= 18) : (h >= 8 && h <= 14);
        if (rainPeak) rainChance = Math.min(99, d.rain + 20);
        rainHourly = parseFloat((d.rainMm * (rainPeak ? 0.12 : 0.02)).toFixed(1));
      }

      // Pressure: slight dip midday on hot days
      var presDip = d.temp > 28 && h >= 12 && h <= 16 ? -1 : 0;
      var pressure = Math.round(d.pressure + presDip);

      // Condition: vary through the day
      var cond = d.condition;
      if (h >= 0 && h < 6)   cond = d.condition.includes("⛈") ? "🌧" : d.condition.includes("🌧") ? "🌧" : "🌙";
      if (h >= 6 && h < 9)   cond = d.condition.includes("⛈") ? "⛅" : d.condition;
      if (h >= 20)           cond = d.condition.includes("⛈") ? "⛈️" : d.condition.includes("🌧") ? "🌧" : "🌙";

      // UV index: 0 at night, peaks at solar noon
      var uv = 0;
      if (h >= 6 && h <= 20) {
        var solarProg = 1 - Math.abs((h - 13) / 7);
        var maxUv = d.temp >= 35 ? 9 : d.temp >= 30 ? 8 : d.temp >= 25 ? 7 : d.temp >= 20 ? 5 : 4;
        uv = d.condition.includes("☁") ? Math.round(maxUv * 0.3 * solarProg) : Math.round(maxUv * solarProg * solarProg);
      }

      // Visibility: lower when humid/rainy
      var vis = d.humidity > 80 ? "Poor (2-4km)" : d.humidity > 65 ? "Moderate (5-10km)" : d.humidity > 45 ? "Good (10-20km)" : "Excellent (20km+)";

      // Dew point
      var dewPoint = Math.round(temp - ((100 - humidity) / 5));

      // Wind direction (stable through day, varies by day)
      var dirs = ["N","NE","NE","E","SE","SE","S","SW","SW","W","NW","NW"];
      var windDir = dirs[Math.floor(days.indexOf(d) * 4 + h / 6) % 12];

      // Feels like
      var feelsLike = Math.round(temp + (windMph < 5 ? 1 : windMph < 10 ? 0 : windMph < 15 ? -1 : -3) + (humidity <= 30 ? 0 : humidity <= 50 ? 2 : humidity <= 70 ? 4 : 6));

      // Cloud cover %
      var cloud = cond.includes("☀") || cond.includes("🌡") ? Math.round(Math.random() * 15) :
                  cond.includes("🌤") ? Math.round(20 + Math.random() * 25) :
                  cond.includes("⛅") ? Math.round(40 + Math.random() * 20) :
                  cond.includes("☁") ? Math.round(75 + Math.random() * 20) : 90;

      hours.push({
        day: d.date,
        hour: h,
        timeStr: (h < 10 ? "0" : "") + h + ":00",
        temp: temp,
        feelsLike: feelsLike,
        condition: cond,
        windMph: windMph,
        gustMph: gustMph,
        windDir: windDir,
        humidity: humidity,
        dewPoint: dewPoint,
        pressure: pressure,
        rainChance: Math.min(99, Math.round(rainChance)),
        rainMm: rainHourly,
        uv: uv,
        cloud: cloud,
        visibility: vis,
      });
    }
  });
  return hours;
}

function uvLabel(uv) {
  if (uv === 0) return { label:"None", color:"#555" };
  if (uv <= 2)  return { label:"Low", color:"#7bbf44" };
  if (uv <= 5)  return { label:"Moderate", color:"#ffcc00" };
  if (uv <= 7)  return { label:"High", color:"#ff8800" };
  if (uv <= 10) return { label:"Very High", color:"#ff3d00" };
  return { label:"Extreme", color:"#ff1500" };
}

                      else if(sunTemp >= 28) msgs.push("Warm in sun — comfortable with hydration.");
                      if(h.rainChance >= 70) msgs.push("High chance of rain — carry an umbrella.");
                      else if(h.rainChance >= 40) msgs.push("Rain possible — worth having a jacket.");
                      if(h.windMph >= 20) msgs.push("Strong wind — may feel uncomfortable outdoors.");
                      if(h.humidity >= 80) msgs.push("Very humid — heat feels heavier than indicated.");
                      if(msgs.length === 0) msgs.push("Pleasant conditions — enjoy the weather!");
                      return msgs.join(" ");
                    })()}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Weather Overview (main view) ─────────────────────────────────────────────

  const u   = units;

  const minT  = n>0?Math.min(...forecastData.map(d=>d.temp)):10;
  const maxP  = n>0?Math.max(...forecastData.map(d=>d.pressure)):1035;
  const minP  = n>0?Math.min(...forecastData.map(d=>d.pressure)):995;
  const maxRmm= n>0?Math.max(...forecastData.map(d=>d.rainMm)):1;

  const tabs = [{id:"temp",label:"Temp"},{id:"rain",label:"Rain %"},{id:"rainmm",label:"Rainfall"},{id:"humidity",label:"Humidity"},{id:"wind",label:"Wind"},{id:"pressure",label:"Pressure"}];

  const gd = graph==="rain"    ?{values:forecastData.map(d=>d.rain),    colors:forecastData.map(d=>rc(d.rain)),    max:100}
           : graph==="rainmm"  ?{values:forecastData.map(d=>d.rainMm),  colors:forecastData.map(d=>rc(d.rain)),    max:Math.max(maxRmm,1)}

        <div style={{position:"relative",height:155}}>

                  {detailView==="periods"&&(function(){
                    const periods=getDayPeriods(d);
                    return <div style={{display:"flex",flexDirection:"column",gap:8}}>{["morning","afternoon","evening"].map(function(pKey){const p=periods[pKey];return <div key={pKey} style={{background:"rgba(0,0,0,0.22)",padding:"8px 10px",borderRadius:8,borderLeft:"3px solid "+tc(p.temp)}}><div style={{fontSize:11,color:"#ddd",marginBottom:3}}>{p.time} — {p.condition}</div><div style={{display:"flex",justifyContent:"space-between",fontSize:12}}><b style={{color:tc(p.temp)}}>{fmtTemp(p.temp,u.temp)}</b><span style={{color:rc(p.rain)}}>{p.rain}% · {fmtRain(p.rainMm,u.rain)}</span></div><div style={{fontSize:10,color:wc(p.windMph),marginTop:2}}>Wind: {fmtSpeed(p.windMph,u.speed)}</div><div style={{fontSize:10,color:"#888",marginTop:1}}>{p.note}</div></div>;})}</div>;
                  })()}
                  {isC&&<div style={{color:"#ff7700",marginTop:5,fontSize:10}}>Confirmed forecast</div>}
                  {isN&&<div style={{color:"#4a9fd4",marginTop:5,fontSize:10}}>Near-term forecast</div>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Rationale */}
      <div style={{marginTop:28,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"18px"}}>
        <div style={{fontSize:11,letterSpacing:4,color:"#ff7700",textTransform:"uppercase",marginBottom:14}}>Forecast Rationale</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:14}}>
          {[
            {icon:"🌊",title:"Jet Stream",      text:"Current pattern has the jet stream displaced north, favouring blocking high pressure — a key driver of extended UK heat events."},
            {icon:"🌱",title:"Dry Soil Effect",  text:"England endured its driest spring in 132 years in 2025. Dry ground heats faster, amplifying peak temperatures by 2-4°C."},
            {icon:"☀️",title:"Warm Spring 2026", text:"May 2026 reached 34-35°C — one of the hottest bank holiday weekends on record, setting a warm baseline for summer."},
            {icon:"📈",title:"Heatwave Bias",    text:"Forecast models systematically underestimate heatwave peaks. Temperatures are adjusted upward for the June and July heat events."},
            {icon:"🏆",title:"Record Risk",      text:"May record is 32.8°C, June's is 35.6°C, July's is 40.2°C. Peaks of 36°C (Jun 20) and 38°C (Jul 5) represent plausible record-threatening events."},
            {icon:"⚡",title:"Storm Risk",       text:"On very hot days when humidity rises unexpectedly, violent thunderstorms are possible. Cards flag days where temp and humidity combine dangerously."},
          ].map(function(r,i){
            return <div key={i} style={{display:"flex",gap:12}}><span style={{fontSize:22,flexShrink:0}}>{r.icon}</span><div><div style={{fontSize:13,color:"#e8dcc8",fontWeight:"bold",marginBottom:4}}>{r.title}</div><div style={{fontSize:12,color:"#7a6e5e",lineHeight:1.55}}>{r.text}</div></div></div>;
          })}
        </div>
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [forecastData, setForecastData] = useState(LONDON_DATA);
  const [locationName, setLocationName] = useState("London, England");
  const [dateRange,    setDateRange]    = useState("25 May – 25 July 2026");
  const [searchText,   setSearchText]   = useState("");
  const [searching,    setSearching]    = useState(false);
  const [searchErr,    setSearchErr]    = useState("");
  const [activePage,   setActivePage]   = useState("overview");
  const [showSett,     setShowSett]     = useState(false);
  const [units,        setUnits]        = useState({ temp:"C", speed:"mph", rain:"mm", pressure:"mbar" });

  async function doSearch() {
    if(!searchText.trim()) return;
    setSearching(true); setSearchErr("");
    try {
      const geoRes  = await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(searchText.trim())+"&count=1&language=en&format=json");
      const geoJson = await geoRes.json();
      if(!geoJson.results||!geoJson.results.length){ setSearchErr("Location not found. Try a different name."); setSearching(false); return; }
      const place = geoJson.results[0];
      const wRes  = await fetch("https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+"&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,precipitation_hours,windspeed_10m_max,windgusts_10m_max,relative_humidity_2m_mean,surface_pressure_mean,weathercode&timezone=auto&forecast_days=16");
      const wJson = await wRes.json();
      const days  = wJson.daily;
      const data  = days.time.map(function(t,i){
        const temp=Math.round(days.temperature_2m_max[i]);
        const windMph=Math.round((days.windspeed_10m_max[i]||0)*0.621371);
        const cond=condFromCode(days.weathercode[i]||0,temp);
        const dateStr=new Date(t+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
        return { date:dateStr, temp, low:Math.round(days.temperature_2m_min[i]), type:i<5?"confirmed":i<10?"near":"estimated", condition:cond, note:"Live forecast via Open-Meteo", wind:windMph<5?"very light":windMph<10?"light":windMph<20?"moderate":"fresh", windMph, gustMph:Math.round((days.windgusts_10m_max[i]||windMph*1.3)*0.621371), rain:days.precipitation_probability_max[i]||0, humidity:Math.round(days.relative_humidity_2m_mean[i]||55), pressure:Math.round(days.surface_pressure_mean[i]||1013), rainMm:parseFloat((days.precipitation_sum[i]||0).toFixed(1)), rainHours:Math.round(days.precipitation_hours[i]||0) };
      });
      setForecastData(data);
      setLocationName(place.name+(place.country?", "+place.country:""));
      const first=new Date(days.time[0]+"T12:00:00"), last=new Date(days.time[days.time.length-1]+"T12:00:00");
      setDateRange(first.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+last.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}));
    } catch(e){ setSearchErr("Could not load forecast. Please try again."); }
    setSearching(false);
  }

  function handleKey(e){ if(e.key==="Enter") doSearch(); }

  const pageSty = {fontFamily:"Georgia,'Times New Roman',serif",background:"linear-gradient(160deg,#0a0a1a 0%,#0d1525 40%,#0a0f1e 100%)",minHeight:"100vh",color:"#e8dcc8",overflowX:"hidden"};
  const wrapSty = {position:"relative",zIndex:1,maxWidth:960,margin:"0 auto",padding:"24px 16px 60px"};

  return (
    <div style={pageSty}>
      {showSett && <SettingsPanel units={units} setUnits={setUnits} onClose={function(){setShowSett(false);}} />}
      <div style={wrapSty}>

        {/* ── Top bar: nav + search + settings ── */}
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:20,flexWrap:"wrap"}}>
          <NavDropdown activePage={activePage} setActivePage={setActivePage} />
          <input
            value={searchText}
            onChange={function(e){setSearchText(e.target.value);}}
            onKeyDown={handleKey}
            placeholder="Search any location..."
            style={{flex:1,minWidth:120,padding:"10px 12px",borderRadius:12,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.05)",color:"#fff",fontSize:13,outline:"none"}}
          />
          <button onClick={doSearch} disabled={searching} style={{padding:"10px 14px",borderRadius:12,border:"none",background:searching?"#555":"#ff7700",color:"#fff",fontSize:13,fontWeight:"bold",cursor:searching?"wait":"pointer",whiteSpace:"nowrap",flexShrink:0}}>{searching?"...":"Search"}</button>
          <button onClick={function(){setShowSett(true);}} style={{padding:"10px 12px",borderRadius:12,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.05)",color:"#aaa",fontSize:13,cursor:"pointer",flexShrink:0}}>Settings</button>
        </div>

        {searchErr && <div style={{color:"#ff6666",fontSize:12,marginBottom:12,textAlign:"center"}}>{searchErr}</div>}

        {/* ── Page header ── */}
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:11,letterSpacing:6,color:"#ff7700",textTransform:"uppercase",marginBottom:8}}>Forecast · {locationName}</div>
          <h1 style={{fontSize:"clamp(20px,4vw,36px)",fontWeight:"normal",margin:"0 0 4px",color:"#fff",lineHeight:1.1}}>{dateRange}</h1>
          <div style={{fontSize:12,color:"#9a8c7a",marginBottom:12}}>Daily maxima · Tap any card or bar for details</div>
          <div style={{display:"flex",gap:16,justifyContent:"center",flexWrap:"wrap",fontSize:11,color:"#9a8c7a"}}>
            {[{col:"#ff7700",label:"Confirmed",solid:true},{col:"#4a9fd4",label:"Near-term",solid:false},{col:"#555",label:"Estimated",solid:false}].map(function(l,i){
              return <span key={i} style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:9,height:9,borderRadius:l.solid?2:"50%",background:l.col,display:"inline-block"}}/>{l.label}</span>;
            })}
          </div>
        </div>

        {/* ── Page content ── */}
        {activePage==="overview" && <WeatherOverview forecastData={forecastData} locationName={locationName} dateRange={dateRange} units={units} />}
        {activePage==="ten"      && <TenDayForecast  forecastData={forecastData} units={units} />}
        {activePage==="hourly"   && <HourlyForecast  forecastData={forecastData} units={units} />}
        {activePage!=="overview" && activePage!=="ten" && activePage!=="hourly" && <ComingSoon page={activePage} />}

        <div style={{textAlign:"center",marginTop:18,fontSize:11,color:"#4a4a5a",lineHeight:1.7}}>
          Estimated long-range forecast for illustrative purposes only.<br/>
          Live search powered by Open-Meteo · London data: Met Office informed estimates
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
