function windCategory(mph) {
  if (mph < 5)  return "Very Light Wind";
  if (mph < 10) return "Light Breeze";
  if (mph < 15) return "Moderate Breeze";
  if (mph < 20) return "Fresh Breeze";
  if (mph < 30) return "Strong Breeze";
  if (mph < 40) return "Gale";
  if (mph < 50) return "Strong Gale";
  if (mph < 60) return "Violent Gale";
  if (mph < 73) return "Very Violent Gale";
  return "Hurricane Winds";
}

function getShadeFeelLike(temp, wind, humidity) {
  let feel = temp;
  const we = {"very light":0,"light":-1,"moderate":-3,"fresh":-5};
  feel += (we[wind]||0);
  if (temp>=30&&humidity>=50) feel+=3;
  else if(temp>=32&&humidity>=20) feel-=3;
  else if(temp>=26&&humidity>=50) feel-=4;
  else if(temp>=22&&humidity>=40) feel-=2;
  else if(temp<18&&humidity>=70&&(wind==="fresh"||wind==="moderate")) feel-=1;
  else if(temp<18&&wind==="fresh") feel-=8;
  return Math.round(feel);
}

function getSunFeelLike(temp, wind, humidity) {
  let b;
  if(wind==="very light") b=temp>=32?14:temp>=26?12:temp>=20?10:8;
  else if(wind==="light") b=temp>=32?12:temp>=26?10:temp>=20?8:7;
  else if(wind==="moderate") b=temp>=26?7:6;
  else b=5;
  return Math.round(getShadeFeelLike(temp,wind,humidity)+b);
}
